<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的读书站</title>
<link rel="stylesheet" href="styles.css">
<script>
  /* 尽早应用深色模式，避免打开时白一下再变黑 */
  try {
    var s = JSON.parse(localStorage.getItem("lib.settings") || "{}");
    var t = (s.theme === "dark" || s.theme === "light") ? s.theme
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
    if (typeof s.font === "number" && s.font >= 15 && s.font <= 30) {
      document.documentElement.style.setProperty("--fs", s.font + "px");
    }
  } catch (e) {}
</script>
</head>
<body class="shelf-page">

<header class="topbar">
  <div class="brand">
    <span class="brand-name" id="siteTitle">我的读书站</span>
    <span class="brand-sub" id="siteSubtitle"></span>
  </div>
  <div class="tools">
    <button class="icon-btn" id="fontDec" title="缩小字号">A−</button>
    <button class="icon-btn" id="fontInc" title="放大字号">A+</button>
    <button class="icon-btn" id="themeBtn" title="切换深色/浅色">夜</button>
  </div>
</header>

<main class="shelf">

  <section class="hero">
    <h1 id="heroTitle"></h1>
    <p id="heroIntro"></p>
  </section>

  <div class="shelf-bar">
    <input type="search" id="filter" class="filter" placeholder="搜索书名、作者、标签…" aria-label="搜索">
    <span class="shelf-stat" id="shelfStat"></span>
  </div>

  <div id="categories"></div>

  <section class="howto">
    <h2>怎么加书</h2>
    <ol>
      <li>在 <code>books/</code> 目录里新建一个 <code>书名.js</code>，照 <code>books/zhuangzi.js</code> 的格式填内容。</li>
      <li>打开 <code>books/manifest.js</code>，在该分类的 <code>books</code> 数组里加一项，指向刚建的文件。</li>
      <li>刷新页面即可，<strong>不用改任何代码</strong>。</li>
    </ol>
  </section>

  <footer class="foot">
    <span id="footNote"></span>
  </footer>

</main>

<script src="books/manifest.js"></script>
<script src="js/store.js"></script>
<script src="js/shelf.js"></script>
</body>
</html>
