<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>阅读中…</title>
<link rel="stylesheet" href="styles.css">
<script>
  try {
    var s = JSON.parse(localStorage.getItem("lib.settings") || "{}");
    var t = (s.theme === "dark" || s.theme === "light") ? s.theme
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
    if (typeof s.font === "number" && s.font >= 15 && s.font <= 30) {
      document.documentElement.style.setProperty("--fs", s.font + "px");
    }
  } catch (e) {}
</script>
</head>
<body class="reader-page">

<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开目录">☰</button>
  <a class="back-btn" id="backBtn" href="index.html" title="返回书架">← 书架</a>
  <div class="brand">
    <span class="brand-name" id="brandName">阅读中…</span>
    <span class="brand-sub" id="brandSub"></span>
  </div>
  <div class="tools">
    <button class="icon-btn" id="modeBtn" title="显示或隐藏白话">对照：开</button>
    <button class="icon-btn" id="fontDec" title="缩小字号">A−</button>
    <button class="icon-btn" id="fontInc" title="放大字号">A+</button>
    <button class="icon-btn" id="themeBtn" title="切换深色/浅色">夜</button>
  </div>
</header>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="side-intro">
      <p class="side-crumb" id="sideCrumb"></p>
      <h1 id="sideTitle">阅读中…</h1>
      <p id="sideSub"></p>
    </div>
    <nav class="toc" id="toc" aria-label="目录"></nav>
    <button class="side-return" id="sideReturn" type="button">← 返回书架</button>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="reader" id="reader">
    <article class="paper">

      <header class="chapter-head">
        <p class="chapter-source" id="chapterSource"></p>
        <h2 class="chapter-title" id="chapterTitle"></h2>
        <p class="chapter-summary" id="chapterSummary"></p>
        <div class="chapter-tags" id="chapterTags"></div>
      </header>

      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-text" id="progressText">0 / 0 段</span>
      </div>

      <div class="segments" id="segments"></div>

      <nav class="pager">
        <button class="pager-btn" id="prevBtn">← 上一篇</button>
        <button class="pager-btn" id="nextBtn">下一篇 →</button>
      </nav>

      <section class="hooks" id="hooks" hidden>
        <h3 id="hooksTitle"></h3>
        <p class="hooks-note" id="hooksNote"></p>
        <div class="hook-grid" id="hookGrid"></div>
      </section>

      <footer class="foot">
        原文为公有领域古籍；白话与导读为本地整理，仅供自己读着用。
      </footer>

    </article>
  </main>

</div>

<script src="books/manifest.js"></script>
<script src="js/store.js"></script>
<script src="js/reader.js"></script>
</body>
</html>
